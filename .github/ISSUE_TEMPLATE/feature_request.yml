name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way? Who is it for (trainer, learner, admin, creator)?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like Ekra to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Other options you considered
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Mock-ups, examples from other apps, links.
