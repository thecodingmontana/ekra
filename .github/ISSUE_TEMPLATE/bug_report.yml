name: Bug report
description: Something isn't working as it should
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: A short description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click …
        3. See …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Your role
      options: [Owner, Admin, Trainer, Learner, Guest, Not signed in]
  - type: input
    id: where
    attributes:
      label: Where
      description: Browser and version, device or OS, and the page (without private data).
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots, console or server errors, how often it happens.
