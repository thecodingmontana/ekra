name: CI

# Lint, type-check, test and build on every pull request (Dependabot's included) and on main.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ekra
          POSTGRES_PASSWORD: ekra
          POSTGRES_DB: ekra_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ekra" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # CI-only stand-ins for a throwaway database, not secrets
      DATABASE_URL: postgres://ekra:ekra@localhost:5432/ekra_test
      TEST_DATABASE_URL: postgres://ekra:ekra@localhost:5432/ekra_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm db:migrate
      - run: pnpm test
      - run: pnpm build
