# Production: everything Ekra needs on one server. Managed by scripts/setup.sh and the `ekra` command; settings come
# from the .env next to the repo root. Only the web app listens on the host (127.0.0.1:EKRA_PORT), for your proxy.
name: ekra

x-app-env: &app-env
  env_file: ../.env
  environment:
    DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ekra}
    # file storage inside this network (the .env value is for development on the host)
    S3_ENDPOINT: http://seaweedfs:8333
    NODE_ENV: production

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ekra}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  seaweedfs:
    image: chrislusf/seaweedfs:4.51
    restart: unless-stopped
    command: server -dir=/data -s3 -s3.port=8333
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
    volumes:
      - seaweedfs-data:/data

  # applies database migrations, then exits; the API starts after it succeeds
  migrate:
    <<: *app-env
    build: { context: .., dockerfile: infra/Dockerfile, target: server }
    image: ekra-server
    working_dir: /app/packages/db
    command: ["pnpm", "db:migrate"]
    depends_on:
      postgres: { condition: service_healthy }

  server:
    <<: *app-env
    image: ekra-server
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
      seaweedfs: { condition: service_started }

  # processes uploaded videos (ffmpeg); a stopped worker's video is picked up again when it's back
  worker:
    <<: *app-env
    build: { context: .., dockerfile: infra/Dockerfile, target: worker }
    image: ekra-worker
    restart: unless-stopped
    stop_grace_period: 2m
    depends_on:
      migrate: { condition: service_completed_successfully }
      seaweedfs: { condition: service_started }

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: web
      args:
        BETTER_AUTH_URL: ${BETTER_AUTH_URL:?set BETTER_AUTH_URL in .env}
    image: ekra-web
    restart: unless-stopped
    env_file: ../.env
    environment:
      API_URL: http://server:4000
    ports:
      - "127.0.0.1:${EKRA_PORT:-3000}:3000"
    depends_on: [server]

volumes:
  postgres-data:
  seaweedfs-data:
